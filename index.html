<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For Mimi</title>
<style>
  :root {
    --sage: #9CAF88;
    --sage-deep: #7A9270;
    --sage-pale: #E4EBDD;
    --blue-deep: #2C4A52;
    --blue-mid: #3F6E71;
    --blue-soft: #A9C6C0;
    --cream: #F6F3EA;
    --ink: #223330;
    --gold: #D8B96A;
    --black: #0B0B0B;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  }

  /* ---------- STAGE 1: BLACK BUTTON SCREEN ---------- */
  #curtain {
    position: fixed;
    inset: 0;
    background: var(--black);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: opacity 1.1s ease, visibility 1.1s ease;
  }

  #curtain.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  #press-btn {
    position: relative;
    padding: 22px 44px;
    font-size: 1.3rem;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: #fff;
    background: linear-gradient(145deg, #1a1a1a, #050505);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 50px;
    cursor: pointer;
    box-shadow:
      0 0 0 rgba(216, 185, 106, 0),
      0 8px 30px rgba(0,0,0,0.6);
    transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    animation: pulse-glow 2.4s ease-in-out infinite;
  }

  #press-btn:hover {
    transform: translateY(-3px) scale(1.04);
    box-shadow: 0 10px 40px rgba(216, 185, 106, 0.35);
  }

  #press-btn:active {
    transform: scale(0.94);
  }

  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 0px rgba(216,185,106,0.15), 0 8px 30px rgba(0,0,0,0.6); }
    50% { box-shadow: 0 0 26px rgba(216,185,106,0.45), 0 8px 30px rgba(0,0,0,0.6); }
  }

  #press-btn.burst {
    animation: none;
    transform: scale(0);
    opacity: 0;
    transition: transform 0.4s cubic-bezier(.4,0,1,1), opacity 0.4s ease;
  }

  /* ---------- CONFETTI ---------- */
  #confetti-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 200;
    overflow: hidden;
  }

  .confetti-piece {
    position: absolute;
    top: 0;
    left: 0;
    will-change: transform, opacity;
    opacity: 0;
  }

  @keyframes confetti-burst {
    0% {
      transform: translate(0, 0) rotate(0deg) scale(0.3);
      opacity: 0;
    }
    10% {
      opacity: 1;
    }
    55% {
      transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(1);
      opacity: 1;
    }
    100% {
      transform: translate(var(--tx-final), var(--ty-final)) rotate(var(--rot-final)) scale(0.75);
      opacity: 0;
    }
  }

  /* ---------- STAGE 2: THE BOOK ---------- */
  #page {
    position: relative;
    min-height: 100vh;
    width: 100%;
    background:
      radial-gradient(circle at 20% 15%, rgba(156,175,136,0.35), transparent 55%),
      radial-gradient(circle at 85% 80%, rgba(63,110,113,0.4), transparent 50%),
      linear-gradient(160deg, var(--blue-deep) 0%, var(--blue-mid) 45%, var(--sage-deep) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8vh 6vw;
    opacity: 0;
    transition: opacity 1.4s ease;
  }

  #page.reveal {
    opacity: 1;
  }

  /* shared round-button look, used by mute / hamburger / arrows / drawer close */
  .circle-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.5);
    background: rgba(246, 243, 234, 0.92);
    color: var(--blue-deep);
    font-size: 1.15rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(11, 22, 20, 0.3);
    transition: opacity 0.6s ease, transform 0.2s ease, background 0.2s ease;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  .circle-btn:hover:not(:disabled) {
    transform: scale(1.08);
  }

  .circle-btn:disabled {
    opacity: 0.35;
    cursor: default;
  }

  #mute-btn {
    position: fixed;
    top: 24px;
    right: 24px;
    z-index: 300;
    opacity: 0;
    pointer-events: none;
  }

  #mute-btn.show {
    opacity: 1;
    pointer-events: auto;
  }

  #hamburger-btn {
    position: fixed;
    top: 24px;
    left: 24px;
    z-index: 300;
    opacity: 0;
    pointer-events: none;
    font-size: 1.3rem;
  }

  #hamburger-btn.show {
    opacity: 1;
    pointer-events: auto;
  }

  /* ---------- BOOK ---------- */
  .book-wrap {
    position: relative;
    width: 100%;
    max-width: 640px;
  }

  .book-stage {
    position: relative;
    width: 100%;
    height: 60vh; /* JS sets the real per-poem height as soon as it runs; this is just the pre-JS fallback */
    min-height: 320px;
    max-height: 88vh;
    transition: height 0.5s ease;
  }

  .book-stage.flipping {
    perspective: 2400px;
  }

  .leaf {
    position: absolute;
    inset: 0;
  }

  #leaf-under { z-index: 1; }

  #leaf-top {
    z-index: 2;
    transform: rotateY(0deg);
    transition: transform 0.85s cubic-bezier(.45,.05,.55,.95);
  }

  .book-stage.flipping #leaf-top {
    transform-style: preserve-3d;
  }

  #leaf-top.hinge-left  { transform-origin: left center; }
  #leaf-top.hinge-right { transform-origin: right center; }
  #leaf-top.flip-next   { transform: rotateY(-176deg); }
  #leaf-top.flip-prev   { transform: rotateY(176deg); }

  #leaf-top.flip-next::before,
  #leaf-top.flip-prev::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 3;
    background: linear-gradient(90deg, rgba(11,22,20,0.28), transparent 45%);
    border-radius: 6px;
    pointer-events: none;
  }

  .leaf-face {
    position: absolute;
    inset: 0;
    padding: 4.5rem 3rem 3.5rem;
    background: rgba(246, 243, 234, 0.96);
    border-radius: 6px;
    box-shadow:
      0 30px 80px rgba(11, 22, 20, 0.45),
      0 0 0 1px rgba(255,255,255,0.4) inset;
    text-align: center;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
    backface-visibility: hidden;
  }

  .leaf-face::before,
  .leaf-face::after {
    content: "";
    position: absolute;
    width: 40px;
    height: 40px;
    border: 2px solid var(--gold);
    opacity: 0.85;
  }

  .leaf-face::before { top: 16px; left: 16px; border-right: none; border-bottom: none; }
  .leaf-face::after   { bottom: 16px; right: 16px; border-left: none; border-top: none; }

  #leaf-top .leaf-back {
    transform: rotateY(180deg);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #leaf-top .leaf-back .back-mark {
    font-family: 'Snell Roundhand', 'Brush Script MT', 'Segoe Script', cursive;
    color: var(--blue-soft);
    font-size: 1.3rem;
    opacity: 0.6;
  }

  .eyebrow {
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 0.72rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--sage-deep);
    margin-bottom: 1.4rem;
  }

  .page-title {
    font-family: 'Snell Roundhand', 'Brush Script MT', 'Segoe Script', cursive;
    font-weight: normal;
    font-size: 2.5rem;
    color: var(--blue-deep);
    margin: 0 0 1.6rem 0;
    line-height: 1.15;
  }

  .heart-divider {
    color: var(--gold);
    font-size: 1rem;
    margin: 0 0 1.8rem 0;
    letter-spacing: 10px;
  }

  .poem-body {
    font-size: 1.14rem;
    line-height: 2.0;
    color: var(--ink);
    font-style: italic;
    margin: 0 0 2rem 0;
  }

  .poem-body span.line { display: block; }

  .signoff {
    font-family: 'Snell Roundhand', 'Brush Script MT', 'Segoe Script', cursive;
    font-size: 1.5rem;
    color: var(--sage-deep);
    margin: 0;
  }

  /* first-load stagger, applied once to the very first poem shown */
  .poem-body.stagger span.line {
    opacity: 0;
    transform: translateY(10px);
    animation: fade-up 0.9s ease forwards;
  }
  @keyframes fade-up {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- ARROWS + INDICATOR ---------- */
  .arrow-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 10;
    font-size: 1.5rem;
    line-height: 1;
  }

  .arrow-left  { left: -8px; }
  .arrow-right { right: -8px; }

  @media (max-width: 720px) {
    .arrow-left  { left: 4px; }
    .arrow-right { right: 4px; }
  }

  #page-indicator {
    text-align: center;
    margin-top: 1.1rem;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 0.78rem;
    letter-spacing: 2px;
    color: var(--cream);
    opacity: 0.85;
  }

  #book-hint {
    text-align: center;
    margin-top: 0.3rem;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 0.68rem;
    letter-spacing: 1px;
    color: var(--cream);
    opacity: 0.5;
  }

  #book-empty {
    max-width: 640px;
    width: 100%;
    padding: 4rem 2.5rem;
    background: rgba(246, 243, 234, 0.96);
    border-radius: 6px;
    text-align: center;
    color: var(--ink);
    font-style: italic;
    font-size: 1.05rem;
    line-height: 1.8;
    box-shadow: 0 30px 80px rgba(11, 22, 20, 0.45);
  }

  /* ---------- TABLE OF CONTENTS DRAWER ---------- */
  #toc-overlay {
    position: fixed;
    inset: 0;
    background: rgba(11, 20, 18, 0.45);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
    z-index: 390;
  }

  #toc-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  #toc-drawer {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: min(320px, 84vw);
    background: var(--cream);
    box-shadow: 8px 0 40px rgba(11, 20, 18, 0.4);
    transform: translateX(-100%);
    transition: transform 0.45s cubic-bezier(.45,.05,.55,.95);
    z-index: 400;
    display: flex;
    flex-direction: column;
  }

  #toc-drawer.open {
    transform: translateX(0);
  }

  .toc-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 20px 16px;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 0.75rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--sage-deep);
    border-bottom: 1px solid rgba(122,146,112,0.25);
  }

  #toc-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 10px 24px;
  }

  .toc-item {
    display: flex;
    align-items: baseline;
    gap: 12px;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: 5px;
    padding: 12px 12px;
    cursor: pointer;
    font-family: 'Iowan Old Style', Georgia, serif;
    color: var(--ink);
    transition: background 0.2s ease;
  }

  .toc-item:hover {
    background: var(--sage-pale);
  }

  .toc-item.active {
    background: var(--sage-pale);
  }

  .toc-item.active .toc-title {
    color: var(--blue-deep);
    font-weight: 600;
  }

  .toc-num {
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 0.72rem;
    color: var(--sage-deep);
    min-width: 18px;
  }

  .toc-title {
    font-style: italic;
    font-size: 0.98rem;
  }

  .toc-empty {
    padding: 20px 14px;
    font-style: italic;
    color: var(--blue-mid);
    font-size: 0.92rem;
  }

  @media (max-width: 600px) {
    .leaf-face { padding: 3.4rem 1.6rem 2.6rem; }
    .page-title { font-size: 2rem; }
    .poem-body { font-size: 1.0rem; line-height: 1.9; }
  }

  @media (prefers-reduced-motion: reduce) {
    #press-btn { animation: none; }
    .poem-body.stagger span.line {
      animation: none;
      opacity: 1;
      transform: none;
    }
    #leaf-top { transition: none; }
    #toc-drawer, #toc-overlay { transition: none; }
  }
</style>
</head>
<body>

<div id="curtain">
  <button id="press-btn">PRESS ME MIMI! 🥰</button>
</div>

<div id="confetti-layer"></div>

<audio id="bg-song" src="mimisong.mp3" loop preload="auto"></audio>
<button id="mute-btn" class="circle-btn" aria-label="Mute or unmute music">🔊</button>
<button id="hamburger-btn" class="circle-btn" aria-label="Open table of contents" aria-expanded="false">☰</button>

<div id="page">
  <div class="book-wrap">
    <div class="book-stage" id="book-stage">
      <button id="prev-arrow" class="circle-btn arrow-btn arrow-left" aria-label="Previous poem">‹</button>
      <button id="next-arrow" class="circle-btn arrow-btn arrow-right" aria-label="Next poem">›</button>

      <div class="leaf" id="leaf-under">
        <div class="leaf-face"><div class="leaf-front"></div></div>
      </div>
      <div class="leaf" id="leaf-top">
        <div class="leaf-face"><div class="leaf-front"></div></div>
        <div class="leaf-face leaf-back"><span class="back-mark">♡</span></div>
      </div>
    </div>
    <div id="page-indicator"></div>
    <div id="book-hint">swipe, use ← → , or open the menu for every letter</div>
  </div>

  <div id="book-empty" hidden></div>
</div>

<div id="toc-overlay"></div>
<nav id="toc-drawer" aria-label="Table of contents">
  <div class="toc-head">
    <span>All my letters</span>
    <button id="toc-close" class="circle-btn" aria-label="Close table of contents">✕</button>
  </div>
  <div id="toc-list"></div>
</nav>

<script>
  /* ============================================================
     INTRO: curtain button, confetti burst, music — unchanged
     ============================================================ */
  const btn = document.getElementById('press-btn');
  const curtain = document.getElementById('curtain');
  const confettiLayer = document.getElementById('confetti-layer');
  const page = document.getElementById('page');
  const muteBtn = document.getElementById('mute-btn');
  const hamburgerBtn = document.getElementById('hamburger-btn');

  const confettiColors = ['#9CAF88', '#3F6E71', '#D8B96A', '#F6F3EA', '#A9C6C0', '#7A9270', '#2C4A52'];

  function burstConfetti() {
    const pieceCount = 260;
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const originX = btn.getBoundingClientRect().left + btn.offsetWidth / 2;
    const originY = btn.getBoundingClientRect().top + btn.offsetHeight / 2;

    for (let i = 0; i < pieceCount; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';

      const isCircle = Math.random() > 0.5;
      const size = 7 + Math.random() * 10;
      const color = confettiColors[Math.floor(Math.random() * confettiColors.length)];

      piece.style.width = size + 'px';
      piece.style.height = (isCircle ? size : size * 1.6) + 'px';
      piece.style.background = color;
      piece.style.borderRadius = isCircle ? '50%' : '2px';
      piece.style.left = originX + 'px';
      piece.style.top = originY + 'px';

      const targetX = Math.random() * vw;
      const targetY = Math.random() * vh;
      const tx = targetX - originX;
      const ty = targetY - originY;

      const overshoot = 1.12 + Math.random() * 0.18;
      const txFinal = tx * overshoot;
      const tyFinal = ty * overshoot + (20 + Math.random() * 60);

      const rot = (Math.random() > 0.5 ? 1 : -1) * (280 + Math.random() * 420);
      const rotFinal = rot + (Math.random() > 0.5 ? 1 : -1) * (120 + Math.random() * 200);

      piece.style.setProperty('--tx', tx + 'px');
      piece.style.setProperty('--ty', ty + 'px');
      piece.style.setProperty('--tx-final', txFinal + 'px');
      piece.style.setProperty('--ty-final', tyFinal + 'px');
      piece.style.setProperty('--rot', rot + 'deg');
      piece.style.setProperty('--rot-final', rotFinal + 'deg');

      const duration = 1.6 + Math.random() * 0.9;
      const delay = Math.random() * 0.25;

      piece.style.animation = `confetti-burst ${duration}s cubic-bezier(.16,.84,.36,1) ${delay}s forwards`;

      confettiLayer.appendChild(piece);
      setTimeout(() => piece.remove(), (duration + delay) * 1000 + 200);
    }
  }

  const song = document.getElementById('bg-song');
  song.volume = 0.55;

  btn.addEventListener('click', () => {
    btn.classList.add('burst');
    burstConfetti();

    song.play().catch(() => {});

    setTimeout(() => { curtain.classList.add('hide'); }, 320);

    setTimeout(() => {
      page.classList.add('reveal');
      muteBtn.classList.add('show');
      hamburgerBtn.classList.add('show');
    }, 2000);
  });

  muteBtn.addEventListener('click', () => {
    song.muted = !song.muted;
    muteBtn.textContent = song.muted ? '🔇' : '🔊';
  });

  /* ============================================================
     THE BOOK: loads poems/1.txt, poems/2.txt, ... automatically,
     stopping at the first number that doesn't exist yet. Add a
     new poems/N.txt in the repo and it just shows up here.
     ============================================================ */
  const POEMS_DIR = 'poems/';
  const MAX_POEMS = 500; // safety cap against a runaway loop

  let poems = [];
  let currentIndex = 0;
  let isFlipping = false;

  const bookStage = document.getElementById('book-stage');
  const leafTop = document.getElementById('leaf-top');
  const leafUnder = document.getElementById('leaf-under');
  const topFront = leafTop.querySelector('.leaf-front');
  const underFront = leafUnder.querySelector('.leaf-front');
  const prevArrow = document.getElementById('prev-arrow');
  const nextArrow = document.getElementById('next-arrow');
  const pageIndicator = document.getElementById('page-indicator');
  const bookHint = document.getElementById('book-hint');
  const bookEmpty = document.getElementById('book-empty');
  const tocOverlay = document.getElementById('toc-overlay');
  const tocDrawer = document.getElementById('toc-drawer');
  const tocList = document.getElementById('toc-list');
  const tocClose = document.getElementById('toc-close');

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function escapeHTML(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // First non-blank line of the file is the title. A blank line
  // right after it is skipped. Everything else is the poem body;
  // blank lines inside it become stanza breaks.
  function parsePoem(raw, idx) {
    const lines = raw.replace(/\r\n/g, '\n').split('\n');
    const firstContentIdx = lines.findIndex(l => l.trim().length > 0);

    let title = `Poem ${idx}`;
    let body = lines;

    if (firstContentIdx !== -1) {
      title = lines[firstContentIdx].trim();
      body = lines.slice(firstContentIdx + 1);
      if (body.length && body[0].trim() === '') body = body.slice(1);
    }
    while (body.length && body[body.length - 1].trim() === '') body.pop();

    return { title, body };
  }

  async function fetchPoem(i) {
    const res = await fetch(`${POEMS_DIR}${i}.txt`, { cache: 'no-store' });
    if (!res.ok) return null;
    const raw = await res.text();
    return parsePoem(raw, i);
  }

  async function loadAllPoems() {
    let i = 1;
    while (i <= MAX_POEMS) {
      let poem;
      try {
        poem = await fetchPoem(i);
      } catch (err) {
        if (i === 1) {
          showEmptyState("Your letters couldn't load. If you're previewing this file straight off your computer, the browser blocks that — run a small local server, or just push it to GitHub Pages and it'll load on its own.");
          return;
        }
        break;
      }
      if (!poem) break;
      poems.push(poem);
      i++;
    }
    initBook();
  }

  function showEmptyState(message) {
    bookEmpty.hidden = false;
    bookEmpty.textContent = message;
    bookStage.hidden = true;
    pageIndicator.hidden = true;
    bookHint.hidden = true;
  }

  function initBook() {
    if (poems.length === 0) {
      showEmptyState('Your book is waiting for its first page — add poems/1.txt to the repo.');
      return;
    }
    bookEmpty.hidden = true;
    bookStage.hidden = false;
    pageIndicator.hidden = false;
    bookHint.hidden = false;
    setStageHeight(poems[0]);
    renderPageInto(topFront, poems[0], true);
    updateControls();
    buildTOC();
  }

  function pageMarkup(poem, isFirstReveal) {
    const lines = poem.body.map((l, i) => {
      const delay = isFirstReveal ? (0.4 + i * 0.1).toFixed(2) : null;
      const style = delay ? ` style="animation-delay:${delay}s"` : '';
      const text = l.trim() === '' ? '&nbsp;' : escapeHTML(l);
      return `<span class="line"${style}>${text}</span>`;
    }).join('');

    return `
      <div class="eyebrow">My infinity, till my last breath</div>
      <h2 class="page-title">${escapeHTML(poem.title)}</h2>
      <div class="heart-divider">♡ ♡ ♡</div>
      <div class="${isFirstReveal ? 'poem-body stagger' : 'poem-body'}">${lines}</div>
      <p class="signoff">— forever yours</p>
    `;
  }

  function renderPageInto(container, poem, isFirstReveal) {
    container.innerHTML = pageMarkup(poem, isFirstReveal);
  }

  // Renders the poem off-screen at the book's real width to measure
  // how tall it naturally wants to be, so the book can size itself
  // to the poem instead of the poem scrolling inside a fixed box.
  function measurePageHeight(poem) {
    const probe = document.createElement('div');
    probe.className = 'leaf-face';
    probe.style.position = 'absolute';
    probe.style.visibility = 'hidden';
    probe.style.pointerEvents = 'none';
    probe.style.top = '0';
    probe.style.left = '-9999px';
    probe.style.right = 'auto';
    probe.style.bottom = 'auto';
    probe.style.width = bookStage.clientWidth + 'px';
    probe.innerHTML = pageMarkup(poem, false);
    document.body.appendChild(probe);
    const h = probe.scrollHeight;
    probe.remove();
    return h;
  }

  function setStageHeight(poem) {
    bookStage.style.height = measurePageHeight(poem) + 'px';
  }

  function updateControls() {
    pageIndicator.textContent = `${currentIndex + 1} / ${poems.length}`;
    prevArrow.disabled = currentIndex === 0;
    nextArrow.disabled = currentIndex === poems.length - 1;
    updateTOCActive();
  }

  function goTo(targetIndex, direction) {
    if (isFlipping || targetIndex < 0 || targetIndex >= poems.length || targetIndex === currentIndex) return;

    if (direction === 'jump' || reduceMotion) {
      currentIndex = targetIndex;
      setStageHeight(poems[currentIndex]);
      renderPageInto(topFront, poems[currentIndex], false);
      updateControls();
      closeTOC();
      return;
    }

    isFlipping = true;
    const goingNext = direction === 'next';

    bookStage.classList.add('flipping');
    setStageHeight(poems[targetIndex]);
    renderPageInto(underFront, poems[targetIndex], false);

    leafTop.classList.remove('hinge-left', 'hinge-right', 'flip-next', 'flip-prev');
    leafTop.classList.add(goingNext ? 'hinge-left' : 'hinge-right');
    void leafTop.offsetWidth; // force reflow before starting the transition
    leafTop.classList.add(goingNext ? 'flip-next' : 'flip-prev');

    let finished = false;
    const finish = () => {
      if (finished) return;
      finished = true;
      leafTop.classList.remove('flip-next', 'flip-prev', 'hinge-left', 'hinge-right');
      bookStage.classList.remove('flipping');
      currentIndex = targetIndex;
      renderPageInto(topFront, poems[currentIndex], false);
      updateControls();
      isFlipping = false;
    };

    leafTop.addEventListener('transitionend', finish, { once: true });
    setTimeout(finish, 1000); // safety net in case transitionend doesn't fire
  }

  prevArrow.addEventListener('click', () => goTo(currentIndex - 1, 'prev'));
  nextArrow.addEventListener('click', () => goTo(currentIndex + 1, 'next'));

  document.addEventListener('keydown', (e) => {
    if (bookStage.hidden) return;
    if (e.key === 'ArrowRight') goTo(currentIndex + 1, 'next');
    if (e.key === 'ArrowLeft') goTo(currentIndex - 1, 'prev');
    if (e.key === 'Escape') closeTOC();
  });

  let touchStartX = null;
  let touchStartY = null;
  bookStage.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  bookStage.addEventListener('touchend', (e) => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      if (dx < 0) goTo(currentIndex + 1, 'next'); else goTo(currentIndex - 1, 'prev');
    }
    touchStartX = null;
    touchStartY = null;
  }, { passive: true });

  function buildTOC() {
    tocList.innerHTML = '';
    if (poems.length === 0) {
      tocList.innerHTML = '<p class="toc-empty">Nothing here yet.</p>';
      return;
    }
    poems.forEach((p, i) => {
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'toc-item';
      item.dataset.index = i;
      item.innerHTML = `<span class="toc-num">${i + 1}</span><span class="toc-title">${escapeHTML(p.title)}</span>`;
      item.addEventListener('click', () => goTo(i, 'jump'));
      tocList.appendChild(item);
    });
    updateTOCActive();
  }

  function updateTOCActive() {
    tocList.querySelectorAll('.toc-item').forEach(el => {
      el.classList.toggle('active', Number(el.dataset.index) === currentIndex);
    });
  }

  function openTOC() {
    tocDrawer.classList.add('open');
    tocOverlay.classList.add('show');
    hamburgerBtn.setAttribute('aria-expanded', 'true');
  }
  function closeTOC() {
    tocDrawer.classList.remove('open');
    tocOverlay.classList.remove('show');
    hamburgerBtn.setAttribute('aria-expanded', 'false');
  }

  hamburgerBtn.addEventListener('click', () => {
    if (tocDrawer.classList.contains('open')) closeTOC(); else openTOC();
  });
  tocClose.addEventListener('click', closeTOC);
  tocOverlay.addEventListener('click', closeTOC);

  // Start loading immediately (behind the curtain) so the book is
  // usually ready the moment it's revealed.
  loadAllPoems();

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (!poems.length || bookStage.hidden) return;
      bookStage.style.transition = 'none';
      setStageHeight(poems[currentIndex]);
      void bookStage.offsetHeight; // flush the no-transition change
      bookStage.style.transition = '';
    }, 150);
  });
</script>

</body>
</html>
